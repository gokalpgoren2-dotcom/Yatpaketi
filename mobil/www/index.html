<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Yatpaketi</title>
<link rel="prefetch" href="https://www.yatpaketi.com/">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#06264B;font-family:-apple-system,system-ui,sans-serif;-webkit-user-select:none;user-select:none}
#sp{position:fixed;inset:0;overflow:hidden}
#sky{position:absolute;inset:0}
.day #sky{background:linear-gradient(180deg,#0A2E57 0%,#14507F 45%,#4FA3C7 62%)}
.dusk #sky{background:linear-gradient(180deg,#081F42 0%,#3A2E5C 34%,#B4536A 50%,#F2945A 61%)}
.night #sky{background:linear-gradient(180deg,#020F24 0%,#06264B 50%,#0B3566 62%)}
.sun{position:absolute;border-radius:50%;opacity:0;animation:fade .8s ease-out forwards}
.day .sun{width:240px;height:240px;left:calc(50% + 0px);top:9.5%;background:radial-gradient(circle,#FFF 0 11%,#FFE9A0 13%,rgba(255,229,138,.38) 22%,rgba(255,229,138,.12) 40%,rgba(255,229,138,0) 68%)}
.dusk .sun{width:100px;height:100px;left:calc(50% + 92px);top:calc(57% - 34px);background:radial-gradient(circle,#FFD08A,#F7764A 70%);box-shadow:0 0 80px 40px rgba(247,118,74,.45);animation:fade .8s ease-out forwards,sink 3s linear forwards}
.night .sun{width:46px;height:46px;left:calc(50% + 95px);top:17%;box-shadow:-9px 7px 0 0 #F4F1E4;transform:rotate(-15deg);filter:drop-shadow(0 0 14px rgba(244,241,228,.5))}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:0;display:none}
.night .star{display:block;animation:tw 1.4s ease-in-out infinite alternate}
.wave{position:absolute;left:-100%;width:300%;height:50%;top:57%}
.w1{animation:drift 3s linear infinite}
.day .w1 path{fill:#0F5C8A}.dusk .w1 path{fill:#123F68}.night .w1 path{fill:#0A2D55}
.glint{position:absolute;left:calc(50% + 77px);width:70px;top:calc(57% + 46px);height:210px;filter:blur(16px);opacity:0;animation:fade 1s ease-out .3s forwards;background:linear-gradient(180deg,var(--g),rgba(0,0,0,0))}
.day .glint{--g:rgba(255,240,190,.45)}.dusk .glint{--g:rgba(247,140,80,.7)}.night .glint{--g:rgba(244,241,228,.28);width:50px;left:calc(50% + 90px)}
.lg{position:absolute;left:50%;display:flex;align-items:center;gap:8px}
#logo{top:calc(57% - 30px);transform:translate(-50%,-50%)}
#refl{top:calc(57% + 94px);transform:translate(-50%,-50%) scaleY(-.7);opacity:.2;filter:blur(1.2px);animation:ripple .9s ease-in-out infinite alternate}
.sym{width:58px;height:auto;opacity:0;transform:translateY(46px);animation:rise .7s cubic-bezier(.2,.8,.2,1) .1s forwards}
#refl .sym{transform:translateY(-46px)}
.ww{overflow:hidden;width:0;animation:reveal .45s cubic-bezier(.4,0,.2,1) .6s forwards}
.ww img{height:41px;display:block}
#off{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center;color:#fff;background:#06264B}
#off h1{font-size:22px;font-weight:600;margin:24px 0 8px}#off p{margin:0;opacity:.75;font-size:15px;line-height:1.5;max-width:300px}
#off button{margin-top:28px;border:0;border-radius:999px;background:#1BB4C4;color:#06264B;font-size:15px;font-weight:700;padding:13px 28px}
.out #sp{animation:out .35s ease-in forwards}
@keyframes rise{to{opacity:1;transform:translateY(0)}}
@keyframes reveal{to{width:183px}}
@keyframes drift{to{transform:translateX(33.333%)}}
@keyframes ripple{from{transform:translate(-50%,-50%) scaleY(-.7) skewX(-3deg)}to{transform:translate(-50%,-50%) scaleY(-.66) skewX(3deg)}}
@keyframes fade{to{opacity:1}}
@keyframes sink{from{transform:translateY(-30px)}to{transform:translateY(0)}}
@keyframes tw{from{opacity:.15}to{opacity:.9}}
@keyframes out{to{opacity:0;transform:scale(1.06)}}
</style>
</head>
<body>
<div id="sp">
  <div id="sky"></div>
  <div class="sun"></div>
  <div id="stars"></div>
  <div id="logo" class="lg"><img class="sym" src="sym.png" alt="yatpaketi"><div class="ww"><img src="word.png" alt=""></div></div>
  <svg class="wave w1" viewBox="0 0 1170 400" preserveAspectRatio="none" aria-hidden="true"><path d="M0 40 Q 65 20 130 40 T 260 40 T 390 40 T 520 40 T 650 40 T 780 40 T 910 40 T 1040 40 T 1170 40 V400 H0Z"/></svg>
  <div class="glint"></div>
  <div id="refl" class="lg" aria-hidden="true"><img class="sym" src="sym.png" alt=""><div class="ww"><img src="word.png" alt=""></div></div>
</div>
<div id="off">
  <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#1BB4C4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 8.5a15 15 0 0 1 20 0"/><path d="M5.5 12a10 10 0 0 1 13 0"/><path d="M9 15.5a5 5 0 0 1 6 0"/><path d="M12 19h.01"/><path d="M3 3l18 18"/></svg>
  <h1>İnternet bağlantısı yok</h1>
  <p>Yatpaketi'ni kullanmak için internete bağlanın ve tekrar deneyin.</p>
  <button type="button" onclick="location.reload()">Tekrar dene</button>
</div>
<script>
// Açılış: gökyüzü, yatların bulunduğu kıyının (Fethiye–Göcek) o anki gün doğumu/batımına göre seçilir; konum izni istenmez.
var SITE = "https://www.yatpaketi.com/";
function sunTimes(d, lat, lon) {
  // NOAA'nın sadeleştirilmiş hesabı; sonuç UTC dakika (gün doğumu, gün batımı).
  var rad = Math.PI / 180, start = Date.UTC(d.getUTCFullYear(), 0, 0);
  var n = Math.floor((d - start) / 864e5);
  var g = 2 * Math.PI / 365 * (n - 1);
  var eq = 229.18 * (0.000075 + 0.001868 * Math.cos(g) - 0.032077 * Math.sin(g) - 0.014615 * Math.cos(2 * g) - 0.040849 * Math.sin(2 * g));
  var dec = 0.006918 - 0.399912 * Math.cos(g) + 0.070257 * Math.sin(g) - 0.006758 * Math.cos(2 * g) + 0.000907 * Math.sin(2 * g) - 0.002697 * Math.cos(3 * g) + 0.00148 * Math.sin(3 * g);
  var ha = Math.acos(Math.cos(90.833 * rad) / (Math.cos(lat * rad) * Math.cos(dec)) - Math.tan(lat * rad) * Math.tan(dec)) / rad;
  var noon = 720 - 4 * lon - eq;
  return [noon - 4 * ha, noon + 4 * ha];
}
var now = new Date(), t = sunTimes(now, 36.62, 29.10);
var m = now.getUTCHours() * 60 + now.getUTCMinutes();
var mode = (m > t[0] + 30 && m < t[1] - 60) ? "day" : (m >= t[1] - 60 && m <= t[1] + 35) || (m >= t[0] - 30 && m <= t[0] + 30) ? "dusk" : "night";
var q = new URLSearchParams(location.search); if (q.get("m")) mode = q.get("m");
document.body.className = mode;
[[10,11],[24,19],[38,8],[54,15],[15,30],[64,7],[88,31],[31,39],[8,45],[85,11],[49,27],[69,40]].forEach(function (p, i) {
  var s = document.createElement("i"); s.className = "star"; s.style.left = p[0] + "%"; s.style.top = p[1] + "%"; s.style.animationDelay = (-(i * 0.37) % 1.4) + "s";
  document.getElementById("stars").appendChild(s);
});
// Logo yerine oturunca kısa bir titreşim.
setTimeout(function () {
  try { var H = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Haptics; if (H) H.impact({ style: "LIGHT" }); } catch (e) {}
}, 780);
var gone = false;
function go() {
  if (gone) return; gone = true;
  if (!navigator.onLine) { document.getElementById("off").style.display = "flex"; return; }
  document.body.classList.add("out");
  setTimeout(function () { location.replace(SITE); }, 300);
}
if (!q.get("kal")) { setTimeout(go, 1500); document.addEventListener("click", go); }
</script>
</body>
</html>
