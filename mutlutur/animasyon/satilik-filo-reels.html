<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Mutlutur Satılık Filo</title>
<style>
  @font-face { font-family:OswaldL; src:url(../fontlar/Oswald-700-latin.woff2) format("woff2"); font-weight:200 700; }
  @font-face { font-family:OswaldX; src:url(../fontlar/Oswald-700-latin-ext.woff2) format("woff2"); font-weight:200 700; }
  @font-face { font-family:MontL; src:url(../fontlar/Montserrat-700-latin.woff2) format("woff2"); font-weight:100 900; }
  @font-face { font-family:MontX; src:url(../fontlar/Montserrat-700-latin-ext.woff2) format("woff2"); font-weight:100 900; }
  :root { --kirmizi:#c7161c; --lacivert:#1e1e66; --gece:#071427; --beyaz:#fff; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:hidden; background:var(--gece); }
  body { font-family:MontL, MontX, sans-serif; color:var(--beyaz); }
  .bas { font-family:OswaldL, OswaldX, sans-serif; text-transform:uppercase; }
  .kat { position:absolute; inset:0; overflow:hidden; }
  .abs { position:absolute; }
  .orta { left:0; right:0; text-align:center; }
  img.kapla { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .maske { overflow:hidden; display:block; }
  .maske > span { display:block; will-change:transform; }

  /* Logo */
  .logo { position:absolute; left:50%; text-align:center; }
  .logo .m { font-family:OswaldL,OswaldX; font-weight:700; color:var(--kirmizi); line-height:1; letter-spacing:2px; }
  .logo .y { background:var(--lacivert); color:#fff; font-weight:600; display:flex; justify-content:space-between; }
  .logo .s { color:#e8e8f0; font-weight:500; margin-top:10px; }

  /* Giriş */
  .kelime { top:50%; margin-top:-60px; font-family:MontL,MontX; font-size:96px; font-weight:200; letter-spacing:34px;
    padding-left:34px; text-transform:uppercase; text-shadow:0 4px 40px rgba(0,0,0,.45); }
  .flas { background:#fff; pointer-events:none; }

  /* Sahne A: tam ekran, sadece isim */
  .altGolge { position:absolute; left:0; right:0; bottom:0; height:760px;
    background:linear-gradient(to bottom, rgba(7,20,39,0), rgba(7,20,39,.85)); }
  .ustGolge { position:absolute; left:0; right:0; top:0; height:300px;
    background:linear-gradient(to bottom, rgba(7,20,39,.5), rgba(7,20,39,0)); }
  .numara { left:80px; bottom:420px; font-size:26px; font-weight:400; letter-spacing:10px; color:#e6e9f5; }
  .isim { left:76px; bottom:250px; font-size:150px; font-weight:500; letter-spacing:6px; line-height:1; white-space:nowrap; }
  .tur { left:80px; bottom:190px; font-size:24px; font-weight:400; letter-spacing:9px; color:#dfe3f3; }
  .rozet { top:100px; left:80px; font-size:24px; font-weight:500; letter-spacing:12px; display:flex; align-items:center;
    text-shadow:0 2px 12px rgba(0,0,0,.5); }
  .rozet::before { content:""; width:70px; height:3px; background:var(--kirmizi); margin-right:22px; }
  .isimCizgi { position:absolute; left:80px; bottom:232px; height:3px; background:var(--kirmizi); }

  /* Sahne B: tekne tam görünür + özellikler + fiyat */
  img.arka { position:absolute; inset:-80px; width:calc(100% + 160px); height:calc(100% + 160px); object-fit:cover;
    filter:blur(60px) brightness(.5) saturate(.9); }
  .tonla { position:absolute; inset:0; background:linear-gradient(to bottom, rgba(7,20,39,.88), rgba(7,20,39,.55) 35%,
    rgba(7,20,39,.55) 65%, rgba(7,20,39,.92)); }
  .serit { position:absolute; left:0; width:1080px; top:540px; height:860px; overflow:hidden;
    -webkit-mask-image:linear-gradient(to bottom, transparent, #000 12%, #000 88%, transparent);
            mask-image:linear-gradient(to bottom, transparent, #000 12%, #000 88%, transparent); }
  .serit img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .kIsim { top:170px; font-size:58px; font-weight:500; letter-spacing:14px; padding-left:14px; }
  .kCizgi { position:absolute; top:258px; left:50%; width:60px; margin-left:-30px; height:2px; background:var(--kirmizi); }
  .ozSatir { position:absolute; left:70px; right:70px; top:310px; display:flex; }
  .oz { flex:1; text-align:center; border-left:1px solid rgba(255,255,255,.22); padding:4px 0; }
  .oz:first-child { border-left:none; }
  .oz .e { font-size:19px; font-weight:500; letter-spacing:6px; color:#aab1d3; }
  .oz .d { font-size:36px; font-weight:300; margin-top:12px; white-space:nowrap; letter-spacing:1px; }
  .fiyatE { top:1450px; font-size:20px; font-weight:500; letter-spacing:14px; padding-left:14px; color:#aab1d3; }
  .fiyat { top:1490px; font-family:MontL,MontX; font-size:104px; font-weight:300; letter-spacing:4px; text-transform:none; }
  .mail { top:1680px; font-size:26px; font-weight:400; letter-spacing:3px; color:#dfe3f3; }
  .mail i { font-style:normal; display:block; font-size:18px; letter-spacing:8px; color:#8f97c0; margin-bottom:14px; }

  /* Geçiş perdesi */
  .perde { position:absolute; top:-200px; height:2320px; width:1700px; transform:skewX(-10deg); }

  /* Kapanış */
  .izgara { position:absolute; left:70px; right:70px; top:150px; display:grid; grid-template-columns:1fr 1fr; gap:60px 40px; }
  .kart { position:relative; }
  .kart .r { position:relative; height:400px; overflow:hidden; }
  .kart img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .kart .n { margin-top:24px; font-size:30px; font-weight:500; letter-spacing:6px; }
  .kart .c { width:40px; height:2px; background:var(--kirmizi); margin:14px 0; }
  .kart .f { font-size:28px; font-weight:300; letter-spacing:2px; color:#dfe3f3; }
  .cta { left:50%; border:1.5px solid rgba(255,255,255,.85); padding:26px 50px; font-size:30px; font-weight:400;
    letter-spacing:4px; white-space:nowrap; }
</style>
</head>
<body>
<div id="sahne" class="kat"></div>
<script>
/* ======================================================================
   İLANLAR — rakamları buradan güncelle.
   A: tam ekran kaydırmalı foto (x0→x1 = yatay odak %), B: teknenin tam göründüğü foto
   ====================================================================== */
const MAIL = "info@mutluturyachting.com", WEB = "mutluturyachting.com";
const TEKNELER = [
  { ad:"MERELEY I", tur:"AES YACHT · 2024 · EXPLORER", fiyat:10485000,
    A:{f:"mereley-1.webp", x0:22, x1:62}, B:{f:"mereley-2.webp", ox:45},
    oz:[["BOY","34,62 M"],["EN","7,60 M"],["MOTOR","2×800 HP"],["KABİN","5 · 12 KİŞİ"]] },
  { ad:"MERMAID", tur:"MOTORSAILER · 2009 / REFIT 2020", fiyat:2500000,
    A:{f:"mermaid-1.webp", x0:40, x1:58}, B:{f:"mermaid-2.webp", ox:58},
    oz:[["BOY","34 M"],["EN","7,50 M"],["MOTOR","2×450 HP"],["KABİN","5 · 10 KİŞİ"]] },
  { ad:"WHITE SWAN", tur:"GULET · 2004", fiyat:495000,
    A:{f:"white-swan-2.webp", x0:28, x1:60}, B:{f:"white-swan-1.webp", ox:55},
    oz:[["BOY","32 M"],["EN","7,90 M"],["MOTOR","2×440 HP"],["KABİN","6 · 12 KİŞİ"]] },
  { ad:"AZIMUT 54 FLY", tur:"AZIMUT · FLYBRIDGE", fiyat:600000,
    A:{f:"azimut54-1.webp", x0:78, x1:30}, B:{f:"azimut54-2.webp", ox:50},
    oz:[["BOY","16,70 M"],["EN","4,95 M"],["MOTOR","2×725 HP"],["KABİN","3 · 6 KİŞİ"]] },
];
const KELIMELER = ["LÜKS.", "KONFOR.", "GÜÇ.", "YATIRIM."];
const GIRIS = 3.2, TEKNE = 6.6, KAPANIS = 5.0, WHIP = 3.0;
const SURE = GIRIS + TEKNELER.length * TEKNE + KAPANIS;

/* ===== Yardımcılar ===== */
const clamp = (x,a=0,b=1) => Math.min(b, Math.max(a, x));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);
const easeQ = x => 1 - Math.pow(1 - clamp(x), 5);
const inOut = x => { x = clamp(x); return x<.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2; };
const p = (t,a,b) => clamp((t-a)/(b-a));
const lerp = (a,b,x) => a + (b-a)*x;
const el = h => { const d = document.createElement("div"); d.innerHTML = h.trim(); return d.firstChild; };
const euro = n => "€ " + Math.round(n).toLocaleString("de-DE");
const sahne = document.getElementById("sahne");
const foto = f => `../fotograflar/${f}`;
const vis = (e, on) => e.style.display = on ? "block" : "none";
const tr = (e, s) => e.style.transform = s;
const logoHTML = o => `<div class="logo">
  <div class="m" style="font-size:${150*o}px">MUTLUTUR</div>
  <div class="y" style="font-size:${40*o}px;padding:${8*o}px ${18*o}px;margin-top:${6*o}px">
    ${"YACHTING".split("").map(c=>`<span>${c}</span>`).join("")}</div>
  <div class="s" style="font-size:${28*o}px">Since 2003</div></div>`;
const minFiyat = Math.min(...TEKNELER.map(T => T.fiyat));

/* ===== Giriş: hızlı kesmeler + logo ===== */
const giris = el(`<div class="kat"></div>`); sahne.appendChild(giris);
const montaj = TEKNELER.map((T, i) => {
  const k = el(`<div class="kat"><img class="kapla" src="${foto(T.A.f)}" style="object-position:${(T.A.x0+T.A.x1)/2}% 50%">
    <div class="kat" style="background:rgba(7,20,39,.42)"></div>
    <div class="abs orta bas kelime">${KELIMELER[i]}</div></div>`);
  giris.appendChild(k); return { k, img:k.querySelector("img"), w:k.querySelector(".kelime") };
});
const gLogoK = el(`<div class="kat" style="background:radial-gradient(110% 60% at 50% 45%, #14205a 0%, var(--gece) 75%)"></div>`);
giris.appendChild(gLogoK);
const gLogo = el(logoHTML(1.3)); gLogoK.appendChild(gLogo); gLogo.style.top = "560px";
const gHook1 = el(`<div class="abs orta" style="top:1010px;font-size:40px;font-weight:300;letter-spacing:22px;padding-left:22px">${TEKNELER.length} SATILIK YAT</div>`);
const gHook2 = el(`<div class="abs orta" style="top:1100px;font-size:28px;font-weight:300;letter-spacing:3px;color:#c9cce3">
  <span style="display:inline-block;width:40px;height:2px;background:var(--kirmizi);vertical-align:middle;margin-right:18px"></span><b style="color:#fff;font-weight:500">${euro(minFiyat)}</b>'den başlayan fiyatlarla<span style="display:inline-block;width:40px;height:2px;background:var(--kirmizi);vertical-align:middle;margin-left:18px"></span></div>`);
gLogoK.append(gHook1, gHook2);
const flas = el(`<div class="kat flas" style="opacity:0"></div>`); giris.appendChild(flas);

/* ===== Tekneler ===== */
const sahneler = TEKNELER.map((T, i) => {
  const k = el(`<div class="kat" style="display:none">
    <div class="kat segB">
      <img class="arka" src="${foto(T.B.f)}"><div class="tonla"></div>
      <div class="serit"><img src="${foto(T.B.f)}" style="object-position:${T.B.ox}% 50%"></div>
      <div class="abs orta bas kIsim">${T.ad}</div><div class="kCizgi"></div>
      <div class="ozSatir">${T.oz.map(([e,d])=>`<div class="oz"><div class="e">${e}</div><div class="d">${d}</div></div>`).join("")}</div>
      <div class="abs orta fiyatE">FİYAT</div>
      <div class="abs orta bas fiyat">€ 0</div>
      <div class="abs orta mail"><i>BİLGİ & GÖRÜNTÜLEME</i>${MAIL}</div>
    </div>
    <div class="kat segA">
      <img class="kapla" src="${foto(T.A.f)}">
      <div class="ustGolge"></div><div class="altGolge"></div>
      <div class="abs rozet">SATILIK · FOR SALE</div>
      <div class="isimCizgi"></div>
      <div class="abs numara">0${i+1} / 0${TEKNELER.length}</div>
      <div class="abs bas isim maske"><span>${T.ad}</span></div>
      <div class="abs tur maske"><span>${T.tur}</span></div>
    </div>
  </div>`);
  sahne.appendChild(k);
  const q = s => k.querySelector(s);
  return { k, T, A:q(".segA"), B:q(".segB"), aImg:q(".segA img"), bImg:q(".serit img"), bArka:q("img.arka"),
    isim:q(".isim > span"), isimK:q(".isim"), tur:q(".tur > span"), numara:q(".numara"), rozet:q(".rozet"),
    kIsim:q(".kIsim"), isimCizgiE:q(".isimCizgi"), kCizgiE:q(".kCizgi"), ozler:[...k.querySelectorAll(".oz")], fiyatE:q(".fiyatE"), fiyat:q(".fiyat"), mail:q(".mail") };
});

/* ===== Kapanış: ızgara + CTA ===== */
const kap = el(`<div class="kat" style="display:none;background:var(--gece)"></div>`); sahne.appendChild(kap);
const izgara = el(`<div class="izgara">${TEKNELER.map(T=>`<div class="kart"><div class="r"><img src="${foto(T.B.f)}" style="object-position:${T.B.ox}% 50%"></div>
  <div class="n bas">${T.ad}</div><div class="c"></div><div class="f">${euro(T.fiyat)}</div></div>`).join("")}</div>`);
kap.appendChild(izgara);
const kartlar = [...izgara.children];
const kBas = el(`<div class="abs orta" style="top:1330px;font-size:44px;font-weight:300;letter-spacing:2px">Hayalinizdeki yat, bir mail uzakta.</div>`);
const kAlt = el(`<div class="abs orta" style="top:1410px;font-size:18px;font-weight:500;letter-spacing:9px;color:#8f97c0">DETAYLI BİLGİ · GÖRÜNTÜLEME</div>`);
const kCta = el(`<div class="abs cta" style="top:1470px">${MAIL}</div>`);
const kLogo = el(logoHTML(.5)); kLogo.style.top = "1690px";
kap.append(kBas, kAlt, kCta, kLogo);

/* ===== Geçiş perdesi (kırmızı + lacivert eğik panel) ===== */
const perdeK = el(`<div class="perde" style="background:var(--gece);z-index:90;box-shadow:-14px 0 0 var(--kirmizi)"></div>`);
const perdeL = el(`<div class="perde" style="background:var(--lacivert);z-index:89"></div>`);
sahne.append(perdeL, perdeK);
const GECISLER = [GIRIS, ...TEKNELER.map((_, i) => GIRIS + (i + 1) * TEKNE)];

const fade = (e, o, y=0, x=0, s=1) => { e.style.opacity = o; tr(e, `translate(${x}px,${y}px) scale(${s})`); };
const fadeC = (e, o, y=0, s=1) => { e.style.opacity = o; tr(e, `translateX(-50%) translateY(${y}px) scale(${s})`); };

window.renderAt = function (t) {
  /* --- Giriş --- */
  vis(giris, t < GIRIS + .1);
  const KES = .42;
  montaj.forEach((M, i) => {
    const u = t - i * KES, on = u >= 0 && (i === montaj.length - 1 ? t < 1.7 : u < KES);
    vis(M.k, on);
    if (on) { tr(M.img, `scale(${lerp(1.28, 1.1, easeQ(u / KES))})`);
      fade(M.w, ease(p(u, 0, .12)), 0, 0, lerp(1.25, 1, easeQ(u / .3))); }
  });
  vis(gLogoK, t >= 1.7);
  const lg = easeQ(p(t, 1.7, 2.1));
  fadeC(gLogo, lg, 0, lerp(1.5, 1, lg));
  fade(gHook1, ease(p(t, 2.05, 2.45)), (1 - ease(p(t, 2.05, 2.45))) * 40);
  fade(gHook2, ease(p(t, 2.3, 2.7)), (1 - ease(p(t, 2.3, 2.7))) * 30);
  flas.style.opacity = Math.max(0, 1 - Math.abs(t - 1.7) / .18) * .9;

  /* --- Tekneler --- */
  sahneler.forEach((S, i) => {
    const t0 = GIRIS + i * TEKNE, u = t - t0;
    const on = u >= 0 && u < TEKNE; vis(S.k, on);
    if (!on) return;
    // A: tam ekran kaydırma
    const kx = inOut(p(u, 0, WHIP + .3));
    S.aImg.style.objectPosition = `${lerp(S.T.A.x0, S.T.A.x1, kx)}% 50%`;
    tr(S.aImg, `scale(${lerp(1.12, 1.02, ease(p(u, 0, WHIP)))})`);
    fade(S.rozet, ease(p(u, .3, .7)), 0, (1 - ease(p(u, .3, .7))) * -60);
    fade(S.numara, ease(p(u, .45, .85)));
    tr(S.isim, `translateY(${(1 - easeQ(p(u, .5, 1.1))) * 105}%)`);
    tr(S.tur, `translateY(${(1 - easeQ(p(u, .8, 1.3))) * 110}%)`);
    S.isimCizgiE.style.width = inOut(p(u, .9, 1.5)) * 120 + "px";
    // Whip pan: A sola savrulur, B sağdan gelir (hareket bulanıklığı)
    const w = inOut(p(u, WHIP - .18, WHIP + .18)), bl = Math.sin(Math.PI * w) * 28;
    tr(S.A, `translateX(${-1080 * w}px)`); S.A.style.filter = bl > .5 ? `blur(${bl}px)` : "none";
    tr(S.B, `translateX(${1080 * (1 - w)}px)`); S.B.style.filter = bl > .5 ? `blur(${bl}px)` : "none";
    vis(S.A, w < 1); vis(S.B, w > 0);
    // B: tekne + bilgiler
    const v = u - WHIP;
    tr(S.bImg, `scale(${lerp(1.0, 1.07, p(v, 0, TEKNE - WHIP))})`);
    fade(S.kIsim, ease(p(v, .1, .5)), (1 - ease(p(v, .1, .5))) * -30);
    S.kCizgiE.style.width = inOut(p(v, .3, .8)) * 60 + "px"; S.kCizgiE.style.marginLeft = -inOut(p(v, .3, .8)) * 30 + "px";
    S.ozler.forEach((o, j) => fade(o, ease(p(v, .25 + j * .1, .6 + j * .1)), (1 - ease(p(v, .25 + j * .1, .6 + j * .1))) * 30));
    fade(S.fiyatE, ease(p(v, .5, .8)));
    const sayac = easeQ(p(v, .55, 1.6));
    S.fiyat.textContent = euro(Math.round(S.T.fiyat * sayac / 1000) * 1000);
    fade(S.fiyat, ease(p(v, .55, .9)), (1 - ease(p(v, .55, .9))) * 20);
    fade(S.mail, ease(p(v, 1.4, 1.8)), (1 - ease(p(v, 1.4, 1.8))) * 20);
  });

  /* --- Kapanış --- */
  const k0 = GIRIS + TEKNELER.length * TEKNE, v = t - k0;
  vis(kap, v >= 0);
  kartlar.forEach((c, j) => { const g = easeQ(p(v, .15 + j * .12, .6 + j * .12));
    c.style.opacity = g; tr(c, `translateY(${(1 - g) * 50}px)`);
    tr(c.querySelector("img"), `scale(${lerp(1.15, 1.0, p(v, 0, KAPANIS))})`); });
  fade(kBas, ease(p(v, .9, 1.3)), (1 - ease(p(v, .9, 1.3))) * 40);
  fade(kAlt, ease(p(v, 1.15, 1.5)));
  fadeC(kCta, ease(p(v, 1.35, 1.85)), (1 - ease(p(v, 1.35, 1.85))) * 30);
  fadeC(kLogo, ease(p(v, 1.7, 2.2)));

  /* --- Perde geçişleri --- */
  let px = null;
  GECISLER.forEach(g => { const x = p(t, g - .38, g + .38); if (x > 0 && x < 1) px = inOut(x); });
  vis(perdeK, px !== null); vis(perdeL, px !== null);
  if (px !== null) {
    perdeK.style.left = lerp(1300, -2400, px) + "px";
    perdeL.style.left = lerp(1300, -2400, clamp(px * 1.15 - .1)) + 260 + "px";
  }
};
window.SURE = SURE;
window.HAZIR = Promise.all([document.fonts.ready,
  ...[...document.images].map(i => i.complete ? 1 : new Promise(r => i.onload = i.onerror = r))])
  .then(() => { // uzun isimleri sığdır (fontlar yüklendikten sonra ölç)
    sahneler.forEach(S => { S.k.style.display = "block"; S.A.style.display = "block";
      const w = S.isimK.scrollWidth; if (w > 940) S.isimK.style.fontSize = Math.floor(170 * 940 / w) + "px";
      S.k.style.display = "none"; });
    renderAt(0);
  }).then(() => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r))));
if (!location.search.includes("render")) {
  const t0 = performance.now();
  (function loop(){ renderAt(((performance.now()-t0)/1000) % SURE); requestAnimationFrame(loop); })();
} else renderAt(0);
</script>
</body>
</html>
