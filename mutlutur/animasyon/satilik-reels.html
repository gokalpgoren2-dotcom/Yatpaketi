<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Mutlutur Satılık Reels</title>
<style>
  /* Marka renkleri (geçici — Mutlutur'un gerçek kodlarıyla değiştirilecek) */
  :root { --lacivert:#0a1a2f; --lacivert2:#12304f; --altin:#c9a45c; --beyaz:#f6f3ec; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:hidden; background:var(--lacivert); }
  body { font-family:"Inter","Inter Display",sans-serif; color:var(--beyaz); }
  #sahne { position:absolute; inset:0; overflow:hidden;
    background:radial-gradient(120% 70% at 50% 25%, var(--lacivert2) 0%, var(--lacivert) 70%); }
  .abs { position:absolute; left:0; right:0; text-align:center; }
  #logo1 { top:760px; font-size:110px; font-weight:800; letter-spacing:22px; padding-left:22px; }
  #logo2 { top:900px; font-size:44px; font-weight:400; letter-spacing:30px; padding-left:30px; color:var(--altin); }
  #cizgi { position:absolute; top:880px; left:50%; height:3px; background:var(--altin); }
  #satilik { top:330px; font-size:150px; font-weight:900; letter-spacing:14px; }
  #satilikEtiket { position:absolute; top:250px; left:50%; transform:translateX(-50%);
    font-size:34px; letter-spacing:10px; color:var(--altin); font-weight:600; white-space:nowrap; }
  #tekneAd { top:530px; font-size:58px; font-weight:300; letter-spacing:6px; }
  #deniz { position:absolute; left:0; right:0; top:1050px; height:900px; }
  #yat { position:absolute; top:830px; width:760px; }
  .ozellik { position:absolute; left:110px; right:110px; height:120px; display:flex;
    justify-content:space-between; align-items:center; border-bottom:1px solid rgba(201,164,92,.45);
    font-size:46px; }
  .ozellik span:first-child { color:var(--altin); font-weight:500; letter-spacing:4px; font-size:36px; }
  .ozellik span:last-child { font-weight:700; }
  #fiyatEtiket { top:1180px; font-size:36px; letter-spacing:10px; color:var(--altin); }
  #fiyat { top:1240px; font-size:130px; font-weight:800; }
  #cta { position:absolute; top:1500px; left:50%; transform:translateX(-50%);
    padding:34px 70px; border:3px solid var(--altin); border-radius:80px; font-size:44px;
    font-weight:600; letter-spacing:4px; white-space:nowrap; }
  #telefon { top:1640px; font-size:38px; letter-spacing:4px; opacity:.85; }
  #altLogo { top:1800px; font-size:30px; letter-spacing:12px; color:var(--altin); font-weight:600; }
</style>
</head>
<body>
<div id="sahne">
  <svg id="deniz" viewBox="0 0 1080 900" preserveAspectRatio="none">
    <defs><linearGradient id="dg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d4a73"/><stop offset="1" stop-color="#06111f"/></linearGradient></defs>
    <path id="dalga1" fill="url(#dg)" opacity=".9"/>
    <path id="dalga2" fill="#0c2340" opacity=".85"/>
  </svg>
  <svg id="yat" viewBox="0 0 760 260">
    <!-- Sade motoryat silüeti (gerçek tekne fotoğrafıyla değiştirilecek) -->
    <path d="M20 170 L700 170 L650 225 L90 225 Z" fill="#f6f3ec"/>
    <path d="M20 170 L700 170 L692 180 L28 180 Z" fill="#c9a45c"/>
    <path d="M150 170 L210 110 L560 110 L620 170 Z" fill="#e8e3d8"/>
    <path d="M250 110 L300 65 L500 65 L530 110 Z" fill="#dcd6c8"/>
    <rect x="235" y="125" width="320" height="22" rx="8" fill="#12304f"/>
    <rect x="320" y="77" width="170" height="18" rx="6" fill="#12304f"/>
    <line x1="420" y1="65" x2="420" y2="25" stroke="#f6f3ec" stroke-width="5"/>
    <line x1="400" y1="35" x2="445" y2="35" stroke="#f6f3ec" stroke-width="4"/>
  </svg>

  <div id="cizgi"></div>
  <div id="logo1" class="abs">MUTLUTUR</div>
  <div id="logo2" class="abs">YACHTING</div>

  <div id="satilikEtiket">MUTLUTUR YACHTING</div>
  <div id="satilik" class="abs">SATILIK</div>
  <div id="tekneAd" class="abs"></div>

  <div id="ozellikler"></div>

  <div id="fiyatEtiket" class="abs">FİYAT</div>
  <div id="fiyat" class="abs"></div>
  <div id="cta">Detaylar için DM</div>
  <div id="telefon" class="abs"></div>
  <div id="altLogo" class="abs">MUTLUTUR YACHTING</div>
</div>

<script>
/* ===== İLAN BİLGİLERİ (örnek değerler — gerçek ilanla değiştir) ===== */
const ILAN = {
  tekneAdi: "AZIMUT 55 FLY",
  ozellikler: [["BOY","16,7 m"],["YIL","2019"],["MOTOR","2 × 725 HP"],["KABİN","3 + 1"],["KONUM","Bodrum"]],
  fiyat: "€ 890.000",
  telefon: "+90 5XX XXX XX XX",
};
const SURE = 12; // saniye

/* ===== Yardımcılar ===== */
const $ = id => document.getElementById(id);
const clamp = (x,a=0,b=1) => Math.min(b, Math.max(a, x));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);           // easeOutCubic
const inOut = x => { x = clamp(x); return x<.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2; };
const p = (t, a, b) => clamp((t - a) / (b - a));            // t'nin [a,b] içindeki ilerlemesi
const goster = (el, o, y=0, s=1) => { el.style.opacity = o; el.style.transform =
  (el.dataset.tx || "") + ` translateY(${y}px) scale(${s})`; };

$("tekneAd").textContent = ILAN.tekneAdi;
$("fiyat").textContent = ILAN.fiyat;
$("telefon").textContent = ILAN.telefon;
$("satilikEtiket").dataset.tx = "translateX(-50%)";
$("cta").dataset.tx = "translateX(-50%)";
const ozEls = ILAN.ozellikler.map(([k,v], i) => {
  const d = document.createElement("div");
  d.className = "ozellik"; d.style.top = (760 + i*130) + "px";
  d.innerHTML = `<span>${k}</span><span>${v}</span>`;
  $("ozellikler").appendChild(d); return d;
});

function dalga(t, faz, genlik, y0, hiz) {
  let d = `M0 ${y0}`;
  for (let x = 0; x <= 1080; x += 20)
    d += ` L${x} ${y0 + Math.sin(x/140 + t*hiz + faz)*genlik + Math.sin(x/53 + t*hiz*1.7)*genlik*.3}`;
  return d + " L1080 900 L0 900 Z";
}

/* ===== Zaman çizelgesi: t saniye → kare ===== */
window.renderAt = function (t) {
  // Sahne 1 (0–2.4 sn): logo açılışı
  const l = ease(p(t, .2, 1.2)), lCik = ease(p(t, 2.0, 2.5));
  goster($("logo1"), l * (1 - lCik), (1 - l) * 60 - lCik * 80);
  goster($("logo2"), ease(p(t, .6, 1.5)) * (1 - lCik), (1 - ease(p(t,.6,1.5))) * 40 - lCik * 80);
  const w = inOut(p(t, .1, 1.1)) * 520 * (1 - lCik);
  $("cizgi").style.width = w + "px"; $("cizgi").style.marginLeft = -w/2 + "px";

  // Deniz: her zaman hareketli, sahne 2'de yükselir, sahne 3'te alçalır
  const denizY = 1050 - ease(p(t, 2.2, 3.2)) * 0 + ease(p(t, 5.2, 6.0)) * 520;
  $("deniz").style.top = denizY + "px";
  $("dalga1").setAttribute("d", dalga(t, 0, 22, 140, 1.6));
  $("dalga2").setAttribute("d", dalga(t, 2, 16, 200, 2.1));

  // Sahne 2 (2.4–5.6 sn): SATILIK + yat süzülerek gelir
  const s = ease(p(t, 2.4, 3.2)), sCik = ease(p(t, 5.2, 5.8));
  goster($("satilikEtiket"), ease(p(t, 2.3, 3.0)), 0);
  goster($("satilik"), s * (1 - sCik), (1 - s) * 80 - sCik * 120, .9 + .1 * s);
  const tCik = ease(p(t, 8.6, 9.2));
  goster($("tekneAd"), ease(p(t, 2.9, 3.6)) * (1 - tCik), (1 - ease(p(t,2.9,3.6))) * 40 - sCik * 180);
  const yx = -800 + inOut(p(t, 2.4, 4.2)) * 960 + p(t, 4.2, 12) * 60;
  const yatCik = ease(p(t, 5.2, 6.0));
  $("yat").style.left = yx + "px";
  $("yat").style.top = (830 + Math.sin(t * 2.2) * 8 + yatCik * 520) + "px";
  $("yat").style.transform = `rotate(${Math.sin(t * 1.8) * 1.2}deg) scale(${1 - yatCik * .35})`;
  $("yat").style.opacity = 1 - ease(p(t, 9.0, 9.6));

  // Sahne 3 (5.6–8.8 sn): özellikler tek tek
  const oCik = ease(p(t, 8.6, 9.2));
  ozEls.forEach((el, i) => {
    const g = ease(p(t, 5.6 + i * .35, 6.2 + i * .35));
    el.style.opacity = g * (1 - oCik);
    el.style.transform = `translateX(${(1 - g) * (i % 2 ? 120 : -120)}px) translateY(${-oCik * 80}px)`;
  });
  // Sahne 2 başlığını sahne 3'te yukarıda tut
  $("satilik").style.top = (330 - ease(p(t, 5.4, 6.0)) * 0) + "px";

  // Sahne 4 (9–12 sn): fiyat + CTA
  goster($("fiyatEtiket"), ease(p(t, 9.0, 9.6)), (1 - ease(p(t, 9.0, 9.6))) * 30);
  const f = ease(p(t, 9.2, 10.0));
  goster($("fiyat"), f, (1 - f) * 50, .85 + .15 * f);
  const c = ease(p(t, 10.0, 10.6));
  goster($("cta"), c, (1 - c) * 40, 1 + Math.sin(Math.max(0, t - 10.6) * 4) * .025 * (t > 10.6));
  goster($("telefon"), ease(p(t, 10.4, 11.0)), 0);
  goster($("altLogo"), ease(p(t, 2.6, 3.4)) , 0);
};
window.SURE = SURE;
// Tarayıcıda açınca canlı önizleme (render sırasında ?render=1 ile kapatılır)
if (!location.search.includes("render")) {
  const t0 = performance.now();
  (function loop(){ renderAt(((performance.now()-t0)/1000) % SURE); requestAnimationFrame(loop); })();
} else renderAt(0);
</script>
</body>
</html>
