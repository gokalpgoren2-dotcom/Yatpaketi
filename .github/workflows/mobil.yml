name: Mobil uygulama

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["mobil/**", ".github/workflows/mobil.yml"]

permissions:
  contents: write

concurrency:
  group: mobil-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (deneme APK)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobil
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Paketleri kur
        run: npm install --no-audit --no-fund && npx cap --version
      - name: Android projesini oluştur
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor "#06264B" --iconBackgroundColorDark "#06264B" --splashBackgroundColor "#06264B" --splashBackgroundColorDark "#06264B"
          npx cap sync android
          # Android'in zorunlu ilk açılış ekranı lacivert olsun (varsayılan gri).
          ST=android/app/src/main/res/values/styles.xml
          sed -i 's#<style name="AppTheme.NoActionBarLaunch"\([^>]*\)>#<style name="AppTheme.NoActionBarLaunch"\1>\n        <item name="windowSplashScreenBackground">\#06264B</item>\n        <item name="android:windowSplashScreenBackground">\#06264B</item>#' $ST
          grep -n -A4 NoActionBarLaunch $ST
      - name: APK derle
        working-directory: mobil/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: yatpaketi-android-apk
          path: mobil/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # Ekran görüntüsü: APK'yı bir Android öykünücüsünde açıp uygulamanın nasıl göründüğünü kaydeder.
      - name: Öykünücü için KVM izni
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Öykünücüde aç ve ekran görüntüsü al
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: mobil
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            mkdir -p ekran
            adb shell "screenrecord --time-limit 14 --bit-rate 6000000 /sdcard/acilis.mp4" &
            sleep 1
            adb shell am start -n com.yatpaketi.app/.MainActivity
            sleep 16
            adb pull /sdcard/acilis.mp4 ekran/acilis.mp4 || true
            sleep 4
            adb exec-out screencap -p > ekran/2-site.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yatpaketi-android-ekran
          path: mobil/ekran/
          retention-days: 30
      # Ekran görüntüleri "mobil-ekran" dalına konur (kontrol için).
      - name: Ekran görüntülerini dala koy
        if: always()
        working-directory: .
        run: |
          set -e
          mkdir -p /tmp/ekr && cp mobil/ekran/* /tmp/ekr/ 2>/dev/null || exit 0
          git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          git fetch origin mobil-ekran || true
          git switch --orphan ekran-tmp
          git rm -rfq . >/dev/null 2>&1 || true
          cp /tmp/ekr/* . && git add -A . && git commit -qm "Android ekran görüntüleri (${GITHUB_SHA::7})"
          git push -f origin HEAD:mobil-ekran
      # Telefondan indirilebilsin diye APK "android-deneme" sürüm sayfasına konur.
      - name: APK'yı sürüm sayfasına koy
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp mobil/android/app/build/outputs/apk/debug/app-debug.apk Yatpaketi.apk
          gh release view android-deneme >/dev/null 2>&1 || gh release create android-deneme --prerelease --title "Yatpaketi Android (deneme)" --notes "Deneme sürümü. Android telefonda Yatpaketi.apk dosyasını indirip açın; 'Bilinmeyen kaynaklardan yüklemeye izin ver' sorusuna izin verin."
          gh release upload android-deneme Yatpaketi.apk --clobber

  ios:
    name: iOS (imzasız derleme denemesi)
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobil
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Paketleri kur
        run: npm install --no-audit --no-fund
      - name: iOS projesini oluştur
        run: |
          npx cap add ios
          npx capacitor-assets generate --ios --iconBackgroundColor "#06264B" --splashBackgroundColor "#06264B" --splashBackgroundColorDark "#06264B"
          npx cap sync ios
      - name: Simülatör için derle
        working-directory: mobil/ios/App
        run: |
          if [ -d App.xcworkspace ]; then SRC="-workspace App.xcworkspace"; else SRC="-project App.xcodeproj"; fi
          xcodebuild $SRC -scheme App -configuration Debug -sdk iphonesimulator -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -40
